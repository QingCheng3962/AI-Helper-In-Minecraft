# ============================================================
# B 机器：Nginx 可选配置（不用 Nginx 也可以，Cloudflare 直接指 8080）
#
# 默认指向 other_qq_pic_sent/webapp.py：
#   http://127.0.0.1:8080
#
# 如果只想暴露中继 API（没有网页），再改成：
#   server 127.0.0.1:18765;
# ============================================================

upstream qq_pic {
    server 127.0.0.1:8080;
    keepalive 16;
}

server {
    listen 80;
    server_name pic.qingchengsep.top;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    location / {
        proxy_pass http://qq_pic;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
    }

    # 禁止访问隐藏文件 / 备份文件
    location ~ /\.(?!well-known) { deny all; }
    location ~* \.(?:bak|old|orig|save|swp|sql|db|log)$ { deny all; }
}
