# ============================================================
# B 机器（网站服务器）Nginx 配置模板
# 作用：把 Cloudflare Tunnel / 公网域名反代到 A 机器的机器人 8765
#
# 使用前替换：
#   192.168.1.23   -> A 机器的内网 IP（或 frp/Tailscale 映射到 B 的地址）
#   8765           -> A 机器 imageHttpPort
#   pic.qingchengsep.top -> 你的域名
#
# 本文件放在 /etc/nginx/conf.d/pic.conf（或 sites-enabled/）。
# Cloudflare 隧道指向 B 的 http://127.0.0.1:80，由 CF 负责 HTTPS。
# ============================================================

upstream bot_pic {
    server 192.168.1.23:8765;
    keepalive 16;
}

server {
    listen 80;
    server_name pic.qingchengsep.top;

    # 安全响应头（按需保留/调整）
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    # ---- 图片 ----
    location /pic_http/ {
        proxy_pass http://bot_pic;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # 可选：给图片加缓存，减少 A 的流量
        # proxy_cache pic_cache;
        # proxy_cache_valid 200 7d;
        # proxy_cache_lock on;
    }

    # ---- QQ 消息 API + SSE ----
    location /api/qq/ {
        proxy_pass http://bot_pic;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # SSE 必须关闭缓冲，否则 /api/qq/stream 不会实时推送
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 35m;
        chunked_transfer_encoding off;
    }

    # ---- 健康检查 ----
    location = /health {
        proxy_pass http://bot_pic;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 其它路径一律 404（避免把 A 的未知路径带出去）
    location / {
        return 404;
    }
}

# 如果要在 http {} 里启用图片缓存，把下面放到 nginx.conf 的 http 块：
# proxy_cache_path /var/cache/nginx/pic levels=1:2 keys_zone=pic_cache:20m
#                  max_size=2g inactive=7d use_temp_path=off;
