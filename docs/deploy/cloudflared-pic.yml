# ============================================================
# Cloudflare Tunnel 配置模板（B 机器）
#
# 默认指向 other_qq_pic_sent/webapp.py 的 8080。
# 如果 B 前面加了 Nginx，把 service 改成 http://127.0.0.1:80
# 如果只想暴露中继 API（没有网页），改成 http://127.0.0.1:18765
# ============================================================

tunnel: REPLACE_WITH_TUNNEL_ID
credentials-file: C:\Users\REPLACE_USER\.cloudflared\REPLACE_WITH_TUNNEL_ID.json

ingress:
  - hostname: pic.qingchengsep.top
    service: http://127.0.0.1:8080
    originRequest:
      connectTimeout: 10s
      noTLSVerify: false

  - service: http_status:404
